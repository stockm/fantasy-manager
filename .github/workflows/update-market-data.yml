name: Update 2026 market data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
  push:
    branches:
      - main
      - feature/market-adp-projections-yahoo-preset
    paths:
      - scripts/update_market_data.py
      - .github/workflows/update-market-data.yml

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Build market data
        run: python scripts/update_market_data.py

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data/market-2026.json; then
            echo "Market data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-2026.json
          git commit -m "chore: refresh 2026 fantasy market data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
